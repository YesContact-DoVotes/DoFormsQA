<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoForms — Modern Form Builder</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 60px; }
    header { background: #1e293b; border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.25rem; font-weight: 700; color: #60a5fa; display: flex; align-items: center; gap: 0.5rem; }
    nav { display: flex; gap: 1.5rem; }
    nav a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.2s; }
    nav a:hover, nav a.active { color: #fff; }
    .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
    h1, h2, h3 { font-weight: 600; margin-bottom: 1rem; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 500; }
    input[type="text"], input[type="email"], select, textarea {
      width: 100%; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 0.65rem 1rem; color: #fff; font-size: 0.95rem; outline: none; transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    .btn { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 0.65rem 1.25rem; font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: background 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #334155; }
    .btn-secondary:hover { background: #475569; }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #dc2626; }
    .btn-success { background: var(--success); }
    .btn-success:hover { background: #059669; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .questions-list { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem; }
    .question-item { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; position: relative; }
    .question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
    .badge { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; background: #334155; color: #cbd5e1; }
    .actions-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1.5rem; }
    .alert { padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; }
    .alert-success { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: #34d399; }
    .alert-danger { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #f87171; }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <span>⚡ DoForms</span>
    </div>
    <nav>
      <a href="#builder" class="active" id="nav-builder">Form Builder</a>
      <a href="#responses" id="nav-responses">Responses</a>
      <a href="#settings" id="nav-settings">Settings</a>
    </nav>
    <button class="btn btn-secondary" id="btn-login-modal">Sign In</button>
  </header>

  <main class="container">
    <div id="notification-area"></div>

    <section class="card" id="form-builder-section">
      <h2>Create New Form</h2>
      <div class="form-group">
        <label for="form-title">Form Title *</label>
        <input type="text" id="form-title" placeholder="e.g. Customer Feedback Survey" value="">
      </div>
      <div class="form-group">
        <label for="form-desc">Description</label>
        <textarea id="form-desc" rows="2" placeholder="Briefly describe the purpose of this form..."></textarea>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3>Form Questions</h3>
          <button class="btn btn-secondary" id="btn-add-question">+ Add Question</button>
        </div>
        <div class="questions-list" id="questions-container">
          <!-- Dynamically populated questions -->
        </div>
      </div>

      <div class="actions-bar">
        <button class="btn btn-secondary" id="btn-preview">Preview Form</button>
        <div style="display: flex; gap: 0.75rem;">
          <button class="btn btn-primary" id="btn-save-form">Save Form</button>
          <button class="btn btn-success" id="btn-publish-form">Publish Form</button>
        </div>
      </div>
    </section>

    <section class="card" id="public-view-section" style="display: none;">
      <h2>Public Form View</h2>
      <div id="public-form-render"></div>
    </section>
  </main>

  <script>
    // State management
    let state = {
      title: localStorage.getItem("doforms_title") || "",
      description: localStorage.getItem("doforms_desc") || "",
      questions: JSON.parse(localStorage.getItem("doforms_questions") || "[]")
    };

    const titleInput = document.getElementById("form-title");
    const descInput = document.getElementById("form-desc");
    const questionsContainer = document.getElementById("questions-container");
    const notifArea = document.getElementById("notification-area");

    titleInput.value = state.title;
    descInput.value = state.description;

    function renderQuestions() {
      questionsContainer.innerHTML = "";
      if (state.questions.length === 0) {
        questionsContainer.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No questions added yet. Click "+ Add Question" to start.</p>';
        return;
      }

      state.questions.forEach((q, idx) => {
        const div = document.createElement("div");
        div.className = "question-item";
        div.innerHTML = `
          <div class="question-header">
            <span class="badge">Question #${idx + 1}</span>
            <div style="display: flex; gap: 0.5rem;">
              <button class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="duplicateQuestion(${idx})">Duplicate</button>
              <button class="btn btn-danger" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="deleteQuestion(${idx})">Delete</button>
            </div>
          </div>
          <input type="text" placeholder="Question Title" value="${q.title}" oninput="updateQuestionTitle(${idx}, this.value)" style="margin-bottom: 0.5rem;">
          <select onchange="updateQuestionType(${idx}, this.value)">
            <option value="text" ${q.type === 'text' ? 'selected' : ''}>Short Text</option>
            <option value="email" ${q.type === 'email' ? 'selected' : ''}>Email Address</option>
            <option value="number" ${q.type === 'number' ? 'selected' : ''}>Number</option>
          </select>
        `;
        questionsContainer.appendChild(div);
      });
    }

    window.updateQuestionTitle = (idx, val) => {
      state.questions[idx].title = val;
    };

    window.updateQuestionType = (idx, val) => {
      state.questions[idx].type = val;
    };

    window.deleteQuestion = (idx) => {
      state.questions.splice(idx, 1);
      renderQuestions();
    };

    window.duplicateQuestion = (idx) => {
      const copy = JSON.parse(JSON.stringify(state.questions[idx]));
      copy.title += " (Copy)";
      state.questions.splice(idx + 1, 0, copy);
      renderQuestions();
    };

    document.getElementById("btn-add-question").addEventListener("click", () => {
      state.questions.push({ title: "New Question", type: "text", required: true });
      renderQuestions();
    });

    document.getElementById("btn-save-form").addEventListener("click", () => {
      const title = titleInput.value.trim();
      if (!title) {
        notifArea.innerHTML = '<div class="alert alert-danger" id="validation-error">Error: Form Title is required before saving!</div>';
        return;
      }
      state.title = title;
      state.description = descInput.value.trim();
      localStorage.setItem("doforms_title", state.title);
      localStorage.setItem("doforms_desc", state.description);
      localStorage.setItem("doforms_questions", JSON.stringify(state.questions));

      notifArea.innerHTML = '<div class="alert alert-success" id="save-success">Form saved successfully! State will persist on reload.</div>';
      setTimeout(() => { notifArea.innerHTML = ""; }, 4000);
    });

    document.getElementById("btn-publish-form").addEventListener("click", () => {
      const title = titleInput.value.trim();
      if (!title) {
        notifArea.innerHTML = '<div class="alert alert-danger">Cannot publish form without a title!</div>';
        return;
      }
      notifArea.innerHTML = '<div class="alert alert-success">Form Published! Public link: http://localhost:3000/#public</div>';
    });

    renderQuestions();
  </script>
</body>
</html>
